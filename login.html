<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Kreatofans</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0a0a0c',
                            card: '#141418',
                            fuchsia: '#d946ef',
                            purple: '#9333ea',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-dark text-white min-h-screen flex flex-col justify-center items-center px-6 selection:bg-brand-fuchsia selection:text-white">
    <!-- Card de Acceso -->
    <div class="w-full max-w-md bg-brand-card border border-zinc-800 rounded-2xl p-8 shadow-2xl">
        <div class="flex flex-col items-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-purple to-brand-fuchsia flex items-center justify-center font-bold text-2xl shadow-lg shadow-brand-fuchsia/30 mb-4">
                K
            </div>
            <h1 class="text-2xl font-black tracking-tight">Bienvenido a Kreatofans</h1>
            <p class="text-xs text-zinc-400 mt-1">Accede a tu panel de creador o de fan</p>
        </div>

        <form class="space-y-4" onsubmit="event.preventDefault(); alert('Sistema de autenticación real listo para conectar con Supabase.');">
            <div>
                <label class="block text-xs font-semibold text-zinc-400 mb-2">Correo Electrónico</label>
                <input type="email5" required class="w-full bg-brand-dark border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-fuchsia transition" placeholder="tucorreo@ejemplo.com">
            </div>
            <div>
                <label class="block text-xs font-semibold text-zinc-400 mb-2">Contraseña</label>
                <input type="password" required class="w-full bg-brand-dark border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-fuchsia transition" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-brand-purple to-brand-fuchsia text-white font-bold py-3 rounded-xl shadow-lg shadow-brand-fuchsia/20 hover:opacity-90 transition mt-2">
                Iniciar Sesión
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-zinc-500">
            ¿Aún no tienes una cuenta? <a href="index.html" class="text-brand-fuchsia hover:underline font-semibold">Volver al inicio</a>
        </div>
    </div>
</body>
</html>
